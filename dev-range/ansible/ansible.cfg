[defaults]
inventory = inventory.json
host_key_checking = True
interpreter_python = /usr/bin/python3
forks = 2
timeout = 30
retry_files_enabled = False
display_args_to_stdout = False

[ssh_connection]
pipelining = True
ssh_args = -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/root/ghostlock-dev/known_hosts -o ConnectTimeout=10

